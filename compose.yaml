services:
  node1:
    build: .
    command: ["java", "-jar", "/usr/app/Raft-Consensus-Protocol-Simulator.jar"]
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      PEERS: node2:node2:8002,node3:node3:8003,node4:node4:8004,node5:node5:8005
      NODE_ID: node1
    container_name:
      node1
    develop:
      watch:
        - action: rebuild
          path: ./build/libs/Raft-Consensus-Protocol-Simulator.jar
    volumes:
      - raft-data:/node1/storage/persistent

  node2:
